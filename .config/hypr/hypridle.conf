$suspend_cmd = systemctl suspend || loginctl suspend

# Pass the string inside the dispatcher's parentheses
$lock_cmd = hyprctl dispatch "hl.dsp.global('quickshell:lock')" & pidof qs quickshell hyprlock || hyprlock

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    
    # dpms expects a Lua table for its arguments
    after_sleep_cmd = hyprctl dispatch "hl.dsp.global('quickshell:lockFocus')" & hyprctl dispatch "hl.dsp.dpms({action='on'})"
    inhibit_sleep = 3
}

